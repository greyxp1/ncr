[package]
name = "ncr"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Evaluation time and closure reports for Nix configurations"
repository = "https://github.com/greyxp1/ncr"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
terminal_size = "0.4"
unicode-width = "0.2"

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"

[profile.release]
lto = "thin"
strip = true
